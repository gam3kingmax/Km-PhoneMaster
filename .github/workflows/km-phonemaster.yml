          EOF

          cat <<'EOF' > app/src/main/java/com/km/phonemaster/monitor/TrafficMonitor.kt
          package com.km.phonemaster.monitor

          import android.app.usage.NetworkStats
          import android.app.usage.NetworkStatsManager
          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.ConnectivityManager
          import android.net.TrafficStats
          import android.os.Build

          data class AppTrafficEntry(
              val appName: String,
              val packageName: String,
              val uid: Int,
              val isSystem: Boolean,
              val rxBytes: Long,
              val txBytes: Long
          ) {
              val totalBytes: Long get() = rxBytes + txBytes
          }

          class TrafficMonitor(private val context: Context) {

              fun getSummary(): String {
                  val totalRx = TrafficStats.getTotalRxBytes().coerceAtLeast(0L)
                  val totalTx = TrafficStats.getTotalTxBytes().coerceAtLeast(0L)
                  val mobileRx = TrafficStats.getMobileRxBytes().coerceAtLeast(0L)
                  val mobileTx = TrafficStats.getMobileTxBytes().coerceAtLeast(0L)

                  val statsManager = context.getSystemService(Context.NETWORK_STATS_SERVICE) as? NetworkStatsManager
                  val now = System.currentTimeMillis()
                  val dayAgo = now - (24L * 60L * 60L * 1000L)

                  var wifi24hBytes = 0L
                  if (statsManager != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try {
                          val bucket = NetworkStats.Bucket()
                          val wifiStats = statsManager.querySummary(
                              ConnectivityManager.TYPE_WIFI,
                              null,
                              dayAgo,
                              now
                          )
                          while (wifiStats.hasNextBucket()) {
                              wifiStats.getNextBucket(bucket)
                              wifi24hBytes += bucket.rxBytes + bucket.txBytes
                          }
                          wifiStats.close()
                      } catch (_: SecurityException) {
                          wifi24hBytes = -1L
                      }
                  }

                  val wifiLabel = if (wifi24hBytes >= 0L) "${formatBytes(wifi24hBytes)} (24h)" else "Grant Usage Stats"
                  return buildString {
                      appendLine("Total RX/TX: ${formatBytes(totalRx)} / ${formatBytes(totalTx)}")
                      appendLine("Mobile RX/TX: ${formatBytes(mobileRx)} / ${formatBytes(mobileTx)}")
                      append("Wi-Fi Usage: $wifiLabel")
                  }
              }

              fun getPerAppUsage(limit: Int = 30): Pair<Boolean, List<AppTrafficEntry>> {
                  val pm = context.packageManager
                  val apps = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                  val statsManager = context.getSystemService(Context.NETWORK_STATS_SERVICE) as? NetworkStatsManager
                  val now = System.currentTimeMillis()
                  val dayAgo = now - (24L * 60L * 60L * 1000L)

                  var permissionGranted = true
                  val entries = mutableListOf<AppTrafficEntry>()

                  for (app in apps) {
                      val uid = app.uid
                      val label = pm.getApplicationLabel(app)?.toString() ?: app.packageName
                      val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0

                      var rx = 0L
                      var tx = 0L

                      if (statsManager != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          try {
                              val bucket = NetworkStats.Bucket()
                              val wifiStats = statsManager.queryDetailsForUid(
                                  ConnectivityManager.TYPE_WIFI,
                                  null,
                                  dayAgo,
                                  now,
                                  uid
                              )
                              while (wifiStats.hasNextBucket()) {
                                  wifiStats.getNextBucket(bucket)
                                  rx += bucket.rxBytes
                                  tx += bucket.txBytes
                              }
                              wifiStats.close()

                              val mobileStats = statsManager.queryDetailsForUid(
                                  ConnectivityManager.TYPE_MOBILE,
                                  null,
                                  dayAgo,
                                  now,
                                  uid
                              )
                              while (mobileStats.hasNextBucket()) {
                                  mobileStats.getNextBucket(bucket)
                                  rx += bucket.rxBytes
                                  tx += bucket.txBytes
                              }
                              mobileStats.close()
                          } catch (_: SecurityException) {
                              permissionGranted = false
                              val uidRx = TrafficStats.getUidRxBytes(uid).coerceAtLeast(0L)
                              val uidTx = TrafficStats.getUidTxBytes(uid).coerceAtLeast(0L)
                              rx = uidRx
                              tx = uidTx
                          }
                      } else {
                          rx = TrafficStats.getUidRxBytes(uid).coerceAtLeast(0L)
                          tx = TrafficStats.getUidTxBytes(uid).coerceAtLeast(0L)
                      }

                      entries.add(
                          AppTrafficEntry(
                              appName = label,
                              packageName = app.packageName,
                              uid = uid,
                              isSystem = isSystem,
                              rxBytes = rx,
                              txBytes = tx
                          )
                      )
                  }

                  val sorted = entries
                      .sortedByDescending { it.totalBytes }
                      .take(limit)
                  return Pair(permissionGranted, sorted)
              }

              fun formatBytes(bytes: Long): String {
                  if (bytes < 1024L) return "$bytes B"
                  val kb = bytes / 1024.0
                  if (kb < 1024.0) return String.format("%.1f KB", kb)
                  val mb = kb / 1024.0
                  if (mb < 1024.0) return String.format("%.1f MB", mb)
                  val gb = mb / 1024.0
                  return String.format("%.2f GB", gb)
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/km/phonemaster/service/PhoneMasterVpnService.kt
          package com.km.phonemaster.service

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat
          import com.km.phonemaster.MainActivity
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.util.concurrent.atomic.AtomicBoolean

          class PhoneMasterVpnService : VpnService() {

              private var tunInterface: ParcelFileDescriptor? = null
              private val running = AtomicBoolean(false)
              private var workerThread: Thread? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action ?: ACTION_START
                  if (action == ACTION_STOP) {
                      stopTunnel()
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  startForeground(NOTIFICATION_ID, buildNotification())
                  val blockedPackages = intent?.getStringArrayListExtra(EXTRA_BLOCKED_PACKAGES)
                      ?: getSavedBlockedPackages()
                  saveBlockedPackages(blockedPackages)
                  startTunnel(blockedPackages)
                  return START_STICKY
              }

              private fun startTunnel(blockedPackages: List<String>) {
                  stopTunnel()
                  running.set(true)

                  val builder = Builder()
                      .setSession("KM PhoneMaster Firewall")
                      .addAddress("10.200.0.1", 32)
                      .addAddress("fd00:200::1", 128)
                      .addRoute("0.0.0.0", 0)
                      .addRoute("::", 0)
                      .setMtu(1500)

                  for (pkg in blockedPackages) {
                      if (pkg.isNotBlank() && pkg != packageName) {
                          try {
                              builder.addAllowedApplication(pkg)
                          } catch (_: Exception) {
                          }
                      }
                  }

                  tunInterface = builder.establish()
                  val fd = tunInterface ?: return

                  workerThread = Thread({
                      val inputStream = FileInputStream(fd.fileDescriptor)
                      val buffer = ByteBuffer.allocate(32767)
                      while (running.get()) {
                          try {
                              val length = inputStream.read(buffer.array())
                              if (length > 0) {
                                  buffer.clear()
                              } else {
                                  Thread.sleep(50L)
                              }
                          } catch (_: InterruptedException) {
                              break
                          } catch (_: Exception) {
                              if (!running.get()) break
                              try {
                                  Thread.sleep(100L)
                              } catch (_: InterruptedException) {
                                  break
                              }
                          }
                      }
                  }, "KM-PhoneMaster-Sink").apply {
                      isDaemon = true
                      start()
                  }
              }

              private fun stopTunnel() {
                  running.set(false)
                  workerThread?.interrupt()
                  workerThread = null
                  try {
                      tunInterface?.close()
                  } catch (_: Exception) {
                  }
                  tunInterface = null
              }

              private fun saveBlockedPackages(packages: List<String>) {
                  val prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  prefs.edit().putStringSet(KEY_BLOCKED_SET, packages.toSet()).apply()
              }

              private fun getSavedBlockedPackages(): ArrayList<String> {
                  val prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  return ArrayList(prefs.getStringSet(KEY_BLOCKED_SET, emptySet()) ?: emptySet())
              }

              private fun buildNotification(): Notification {
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "KM PhoneMaster Network Guard",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      manager.createNotificationChannel(channel)
                  }

                  val openIntent = PendingIntent.getActivity(
                      this,
                      0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("KM PhoneMaster Active")
                      .setContentText("Network rules stay active even when app is closed")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                      .setContentIntent(openIntent)
                      .setOngoing(true)
                      .build()
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  super.onTaskRemoved(rootIntent)
                  val saved = getSavedBlockedPackages()
                  if (saved.isNotEmpty() && running.get()) {
                      startForeground(NOTIFICATION_ID, buildNotification())
                  }
              }

              override fun onDestroy() {
                  stopTunnel()
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_START = "com.km.phonemaster.action.START"
                  const val ACTION_STOP = "com.km.phonemaster.action.STOP"
                  const val EXTRA_BLOCKED_PACKAGES = "com.km.phonemaster.extra.BLOCKED_PACKAGES"
                  private const val CHANNEL_ID = "km_phonemaster_guard_channel"
                  private const val NOTIFICATION_ID = 1001
                  private const val PREFS_NAME = "km_phonemaster_prefs"
                  private const val KEY_BLOCKED_SET = "blocked_packages"
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/km/phonemaster/receiver/BootReceiver.kt
          package com.km.phonemaster.receiver

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import androidx.core.content.ContextCompat
          import com.km.phonemaster.service.PhoneMasterVpnService

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val prefs = context.getSharedPreferences("km_phonemaster_prefs", Context.MODE_PRIVATE)
                      val saved = ArrayList(prefs.getStringSet("blocked_packages", emptySet()) ?: emptySet())
                      if (saved.isNotEmpty() && VpnService.prepare(context) == null) {
                          val serviceIntent = Intent(context, PhoneMasterVpnService::class.java).apply {
                              action = PhoneMasterVpnService.ACTION_START
                              putStringArrayListExtra(PhoneMasterVpnService.EXTRA_BLOCKED_PACKAGES, saved)
                          }
                          ContextCompat.startForegroundService(context, serviceIntent)
                      }
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/km/phonemaster/MainActivity.kt
          package com.km.phonemaster

          import android.Manifest
          import android.app.AppOpsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.net.VpnService
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.os.Process
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.km.phonemaster.monitor.TrafficMonitor
          import com.km.phonemaster.service.PhoneMasterVpnService

          private data class SelectableApp(
              val label: String,
              val packageName: String,
              val isSystem: Boolean
          )

          class MainActivity : AppCompatActivity() {

              private lateinit var tvTrafficStats: TextView
              private lateinit var tvBlockedSummary: TextView
              private lateinit var tvAppList: TextView
              private lateinit var trafficMonitor: TrafficMonitor

              private val vpnPermissionLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      if (result.resultCode == RESULT_OK) {
                          launchFirewallService()
                      }
                  }

              private val notificationPermissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  trafficMonitor = TrafficMonitor(this)
                  tvTrafficStats = findViewById(R.id.tvTrafficStats)
                  tvBlockedSummary = findViewById(R.id.tvBlockedSummary)
                  tvAppList = findViewById(R.id.tvAppList)

                  findViewById<Button>(R.id.btnSelectApps).setOnClickListener {
                      showMultiSelectAppDialog()
                  }

                  findViewById<Button>(R.id.btnRefreshStats).setOnClickListener {
                      refreshUi()
                  }

                  findViewById<Button>(R.id.btnStartFirewall).setOnClickListener {
                      val prepareIntent = VpnService.prepare(this)
                      if (prepareIntent != null) {
                          vpnPermissionLauncher.launch(prepareIntent)
                      } else {
                          launchFirewallService()
                      }
                  }

                  findViewById<Button>(R.id.btnStopFirewall).setOnClickListener {
                      val stopIntent = Intent(this, PhoneMasterVpnService::class.java).apply {
                          action = PhoneMasterVpnService.ACTION_STOP
                      }
                      ContextCompat.startForegroundService(this, stopIntent)
                  }

                  findViewById<Button>(R.id.btnToggleWifi).setOnClickListener {
                      toggleWifi()
                  }

                  findViewById<Button>(R.id.btnGrantPermissions).setOnClickListener {
                      requestAllPermissions()
                  }

                  refreshUi()
              }

              private fun getSavedBlockedSet(): MutableSet<String> {
                  val prefs = getSharedPreferences("km_phonemaster_prefs", Context.MODE_PRIVATE)
                  return (prefs.getStringSet("blocked_packages", emptySet()) ?: emptySet()).toMutableSet()
              }

              private fun saveBlockedSet(blockedSet: Set<String>) {
                  val prefs = getSharedPreferences("km_phonemaster_prefs", Context.MODE_PRIVATE)
                  prefs.edit().putStringSet("blocked_packages", blockedSet.toSet()).apply()
              }

              private fun showMultiSelectAppDialog() {
                  val pm = packageManager
                  val candidates = pm.getInstalledApplications(PackageManager.GET_META_DATA)
                      .filter { it.packageName != packageName }
                      .map { app ->
                          val isSystem = (app.flags and ApplicationInfo.FLAG_SYSTEM) != 0
                          val name = pm.getApplicationLabel(app)?.toString() ?: app.packageName
                          SelectableApp(label = name, packageName = app.packageName, isSystem = isSystem)
                      }
                      .sortedWith(compareBy({ it.isSystem }, { it.label.lowercase() }))

                  if (candidates.isEmpty()) return

                  val displayItems = candidates.map { item ->
                      val tag = if (item.isSystem) "[SYS/PHONE]" else "[3RD]"
                      "$tag ${item.label}\n${item.packageName}"
                  }.toTypedArray()

                  val currentBlocked = getSavedBlockedSet()
                  val checkedStates = BooleanArray(candidates.size) { index ->
                      currentBlocked.contains(candidates[index].packageName)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Select Apps to Block (${candidates.size})")
                      .setMultiChoiceItems(displayItems, checkedStates) { _, which, isChecked ->
                          checkedStates[which] = isChecked
                      }
                      .setPositiveButton("Save & Apply") { _, _ ->
                          val updated = LinkedHashSet<String>()
                          for (i in candidates.indices) {
                              if (checkedStates[i]) {
                                  updated.add(candidates[i].packageName)
                              }
                          }
                          saveBlockedSet(updated)
                          refreshUi()
                          if (updated.isNotEmpty() && VpnService.prepare(this) == null) {
                              launchFirewallService(ArrayList(updated))
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun launchFirewallService(packages: ArrayList<String>? = null) {
                  val selected = packages ?: ArrayList(getSavedBlockedSet())
                  val intent = Intent(this, PhoneMasterVpnService::class.java).apply {
                      action = PhoneMasterVpnService.ACTION_START
                      putStringArrayListExtra(PhoneMasterVpnService.EXTRA_BLOCKED_PACKAGES, selected)
                  }
                  ContextCompat.startForegroundService(this, intent)
              }

              private fun toggleWifi() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startActivity(Intent(Settings.Panel.ACTION_WIFI))
                  } else {
                      val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      @Suppress("DEPRECATION")
                      wifiManager.isWifiEnabled = !wifiManager.isWifiEnabled
                  }
              }

              private fun requestAllPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          notificationPermissionLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }

                  if (!hasUsageStatsPermission()) {
                      startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          }
                          startActivity(intent)
                      }
                  }
              }

              private fun hasUsageStatsPermission(): Boolean {
                  val appOps = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      appOps.unsafeCheckOpNoThrow(
                          AppOpsManager.OPSTR_GET_USAGE_STATS,
                          Process.myUid(),
                          packageName
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      appOps.checkOpNoThrow(
                          AppOpsManager.OPSTR_GET_USAGE_STATS,
                          Process.myUid(),
                          packageName
                      )
                  }
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun refreshUi() {
                  tvTrafficStats.text = trafficMonitor.getSummary()

                  val blockedSet = getSavedBlockedSet()
                  tvBlockedSummary.text = if (blockedSet.isEmpty()) {
                      "Blocked Apps (0): None — tap Select Phone & 3rd-Party Apps to Block"
                  } else {
                      "Blocked Apps (${blockedSet.size}): ${blockedSet.joinToString(", ")}"
                  }

                  val (hasUsageAccess, perAppEntries) = trafficMonitor.getPerAppUsage(limit = 30)
                  val header = if (hasUsageAccess) {
                      "Per-App Byte Usage (Last 24h, Top 30):"
                  } else {
                      "Per-App Byte Usage (Grant Usage Access for full history; showing current session):"
                  }

                  val lines = perAppEntries.joinToString("\n") { entry ->
                      val kind = if (entry.isSystem) "SYS" else "3RD"
                      val blockedMark = if (blockedSet.contains(entry.packageName)) " [BLOCKED]" else ""
                      "[$kind]$blockedMark ${entry.appName} (${entry.packageName}) — RX: ${trafficMonitor.formatBytes(entry.rxBytes)}, TX: ${trafficMonitor.formatBytes(entry.txBytes)}, Total: ${trafficMonitor.formatBytes(entry.totalBytes)}"
                  }
                  tvAppList.text = "$header\n$lines"
              }
          }
          EOF

          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload KM PhoneMaster APK
        uses: actions/upload-artifact@v4
        with:
          name: KM-PhoneMaster-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
